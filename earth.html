    <!-- 地球顶点着色器 -->
    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size;
        attribute vec3 customColor;
        attribute float opacityAttr;
        attribute float orbitSpeed;
        attribute float isRing;
        attribute float aRandomId;

        varying vec3 vColor;
        varying float vDist;
        varying float vOpacity;
        varying float vScaleFactor;
        varying float vIsRing;

        uniform float uTime;
        uniform float uScale;
        uniform float uRotationX;

        mat2 rotate2d(float _angle){
            return mat2(cos(_angle),-sin(_angle),
                        sin(_angle),cos(_angle));
        }

        float hash(float n) { return fract(sin(n) * 43758.5453123); }

        void main() {
            float normScaleLOD = clamp((uScale - 0.15) / 2.35, 0.0, 1.0);
            float visibilityThreshold = 0.9 + pow(normScaleLOD, 1.2) * 0.1;

            if (aRandomId > visibilityThreshold) {
                gl_Position = vec4(0.0);
                gl_PointSize = 0.0;
                return;
            }

            vec3 pos = position;

            float speed = 0.04;
            float cloudOffset = 0.0;
            if (customColor.x > 0.9 && customColor.y > 0.9 && customColor.z > 0.9) {
                cloudOffset = sin(uTime * 0.01 + pos.y * 0.5) * 0.3;
            }
            float bodyAngle = uTime * (speed + cloudOffset * 0.002);
            vec2 rotatedXZ = rotate2d(bodyAngle) * pos.xz;
            pos.x = rotatedXZ.x;
            pos.z = rotatedXZ.y;

            float cx = cos(uRotationX);
            float sx = sin(uRotationX);
            float ry = pos.y * cx - pos.z * sx;
            float rz = pos.y * sx + pos.z * cx;
            pos.y = ry;
            pos.z = rz;

            vec4 mvPosition = modelViewMatrix * vec4(pos * uScale, 1.0);
            float dist = -mvPosition.z;
            vDist = dist;

            if (dist < 40.0 && dist > 0.1) {
                float chaosIntensity = 1.0 - (dist / 40.0);
                chaosIntensity = pow(chaosIntensity, 3.0);
                float noiseX = sin(uTime * 30.0 + pos.x * 5.0) * chaosIntensity * 0.3;
                float noiseY = cos(uTime * 25.0 + pos.y * 5.0) * chaosIntensity * 0.3;
                mvPosition.xyz += vec3(noiseX, noiseY, 0.0);
            }

            gl_Position = projectionMatrix * mvPosition;

            float pointSize = size * (350.0 / dist);
            pointSize *= 0.55;
            gl_PointSize = clamp(pointSize, 0.0, 300.0);

            vColor = customColor;
            vOpacity = opacityAttr;
            vScaleFactor = uScale;
            vIsRing = 0.0;
        }
    </script>

    <!-- 地球片元着色器 -->
    <script type="x-shader/x-fragment" id="fragmentshader">
        varying vec3 vColor;
        varying float vDist;
        varying float vOpacity;
        varying float vScaleFactor;
        varying float vIsRing;

        void main() {
            vec2 cxy = 2.0 * gl_PointCoord - 1.0;
            float r = dot(cxy, cxy);
            if (r > 1.0) discard;

            float glow = pow(1.0 - r, 0.8);
            float t = clamp((vScaleFactor - 0.15) / 2.35, 0.0, 1.0);
            float brightness = 0.4 + 0.8 * t;
            float densityAlpha = 0.25 + 0.45 * smoothstep(0.0, 0.5, t);

            vec3 finalColor = vColor * brightness;

            float edgeGlow = pow(r, 1.5) * (1.0 - r) * 4.0;
            vec3 haloColor = vec3(0.4, 0.6, 1.0) * edgeGlow * 0.8;
            finalColor += haloColor;

            if (vDist < 40.0) {
                float closeMix = 1.0 - (vDist / 40.0);
                vec3 deepTexture = pow(vColor, vec3(1.4)) * 1.2;
                finalColor = mix(finalColor, deepTexture, closeMix * 0.6);
            }

            float depthAlpha = 1.0;
            if (vDist < 10.0) depthAlpha = smoothstep(0.0, 10.0, vDist);

            float alpha = glow * vOpacity * densityAlpha * depthAlpha;

            gl_FragColor = vec4(finalColor, alpha);
        }
    </script>

    <!-- 星空着色器 -->
    <script type="x-shader/x-vertex" id="starVertexShader">
        attribute float size;
        attribute vec3 customColor;
        varying vec3 vColor;
        uniform float uTime;

        void main() {
            vColor = customColor;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float dist = -mvPosition.z;
            gl_PointSize = size * (1000.0 / dist);
            gl_PointSize = clamp(gl_PointSize, 1.0, 8.0);
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script type="x-shader/x-fragment" id="starFragmentShader">
        varying vec3 vColor;
        uniform float uTime;
        float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
        void main() {
            vec2 cxy = 2.0 * gl_PointCoord - 1.0;
            float r = dot(cxy, cxy);
            if (r > 1.0) discard;

            float noise = random(gl_FragCoord.xy);
            float twinkle = 0.6 + 0.4 * sin(uTime * 3.0 + noise * 100.0);

            float glow = 1.0 - r;
            glow = pow(glow, 1.5);

            gl_FragColor = vec4(vColor * twinkle, glow * 0.8);
        }
    </script>

    <!-- 行星着色器 -->
    <script type="x-shader/x-vertex" id="planetVertexShader">
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script type="x-shader/x-fragment" id="planetFragmentShader">
        uniform vec3 color1;
        uniform vec3 color2;
        uniform float noiseScale;
        uniform vec3 lightDir;
        uniform float atmosphere;

        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
        float noise(vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            float a = random(i);
            float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0));
            float d = random(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }

        float fbm(vec2 st) {
            float value = 0.0;
            float amplitude = 0.5;
            for (int i = 0; i < 5; i++) {
                value += amplitude * noise(st);
                st *= 2.0;
                amplitude *= 0.5;
            }
            return value;
        }

        void main() {
            float n = fbm(vUv * noiseScale);
            vec3 albedo = mix(color1, color2, n);

            vec3 normal = normalize(vNormal);
            vec3 light = normalize(lightDir);
            float diff = max(dot(normal, light), 0.05);

            vec3 viewDir = normalize(vViewPosition);
            float fresnel = pow(1.0 - dot(viewDir, normal), 3.0);

            vec3 finalColor = albedo * diff + atmosphere * vec3(0.5, 0.6, 1.0) * fresnel;

            gl_FragColor = vec4(finalColor, 1.0);
        }
    </script>

    <script>
        let scene, camera, renderer, particles, stars, nebula, starTrails;
        let planetGroup;
        let uniforms, starUniforms;

        let targetScale = 1.0;
        let targetRotX = 0.4;
        let currentScale = 1.0;
        let currentRotX = 0.4;

        let targetRotY = 0.0;
        let currentRotY = 0.0;

        let isHandDetected = false;

        const videoElement = document.getElementsByClassName('input_video')[0];
        const statusElement = document.getElementById('status-indicator');
        const loadingElement = document.getElementById('loading');

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020202, 0.00015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.z = 100;
            camera.lookAt(0, 0, 0);

            initStarfield();
            initStarTrails();
            initEarth();
            initPlanets();

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
                powerPreference: "high-performance",
                failIfMajorPerformanceCaveat: false
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            setTimeout(() => {
                if (loadingElement) loadingElement.style.display = 'none';
            }, 1500);

            animate();
        }

        function initEarth() {
            const particleCount = 220000;
            const geometry = new THREE.BufferGeometry();

            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const opacities = new Float32Array(particleCount);
            const orbitSpeeds = new Float32Array(particleCount);
            const isRings = new Float32Array(particleCount);
            const randomIds = new Float32Array(particleCount);

            const R_PLANET = 18;
            const atmosphereRatio = 0.18; 

            for (let i = 0; i < particleCount; i++) {
                randomIds[i] = Math.random();

                let x, y, z, r, g, b, size, opacity;
                let isAtmosphere = i > particleCount * (1 - atmosphereRatio);

                let rad;
                if (!isAtmosphere) {
                    rad = R_PLANET * (0.96 + Math.random() * 0.08);
                } else {
                    rad = R_PLANET * (1.05 + Math.random() * 0.35);
                }

                const theta = 2 * Math.PI * Math.random();
                const phi = Math.acos(2 * Math.random() - 1);

                x = rad * Math.sin(phi) * Math.cos(theta);
                y = rad * Math.cos(phi);
                z = rad * Math.sin(phi) * Math.sin(theta);

                if (isAtmosphere) {
                    r = 0.8 + Math.random() * 0.2;
                    g = 0.85 + Math.random() * 0.15;
                    b = 1.0;
                    size = 0.8 + Math.random() * 1.8;
                    opacity = 0.25 + Math.random() * 0.3;
                } else {
                    let lat = y / R_PLANET;
                    let landNoise = Math.sin(theta * 5.0 + 1.2) * Math.cos(phi * 4.0 + 0.8) * 0.7 
                                   + Math.sin(theta * 9.0 + 2.4) * Math.cos(phi * 6.0 + 1.7) * 0.3;
                    let isLand = (landNoise > 0.05) && (Math.abs(lat) < 1.0);
                    let isPolar = Math.abs(lat) > 0.85;

                    if (isPolar) {
                        r = 0.9 + Math.random() * 0.1;
                        g = 0.9 + Math.random() * 0.1;
                        b = 0.95 + Math.random() * 0.05;
                        size = 0.5 + Math.random() * 0.5;
                        opacity = 0.9;
                    } else if (isLand) {
                        if (Math.random() < 0.6) {
                            r = 0.1 + Math.random() * 0.3; 
                            g = 0.6 + Math.random() * 0.4; 
                            b = 0.1 + Math.random() * 0.2; // 绿
                        } else {
                            r = 0.6 + Math.random() * 0.3; 
                            g = 0.4 + Math.random() * 0.3; 
                            b = 0.1 + Math.random() * 0.3; // 棕
                        }
                        size = 0.6 + Math.random() * 0.6;
                        opacity = 0.9;
                    } else if (Math.random() < 0.25) {
                        r = 1.0; g = 1.0; b = 1.0;
                        opacity = 0.4 + Math.random() * 0.4;
                        size = 1.2 + Math.random() * 1.2;
                    } else {
                        r = 0.05 + Math.random() * 0.2;
                        g = 0.1 + Math.random() * 0.3;
                        b = 0.4 + Math.random() * 0.5;
                        size = 0.4 + Math.random() * 0.4;
                        opacity = 0.8 + Math.random() * 0.2;
                    }
                }

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
                colors[i * 3] = r;
                colors[i * 3 + 1] = g;
                colors[i * 3 + 2] = b;
                sizes[i] = size;
                opacities[i] = (opacity !== undefined) ? opacity : 0.9;
                orbitSpeeds[i] = 0.0;
                isRings[i] = 0.0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacityAttr', new THREE.BufferAttribute(opacities, 1));
            geometry.setAttribute('orbitSpeed', new THREE.BufferAttribute(orbitSpeeds, 1));
            geometry.setAttribute('isRing', new THREE.BufferAttribute(isRings, 1));
            geometry.setAttribute('aRandomId', new THREE.BufferAttribute(randomIds, 1));

            uniforms = {
                uTime: { value: 0 },
                uScale: { value: 1.0 },
                uRotationX: { value: 0.4 }
            };

            const material = new THREE.ShaderMaterial({
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                uniforms: uniforms,
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                transparent: true
            });

            particles = new THREE.Points(geometry, material);
            particles.rotation.z = 0;
            scene.add(particles);
        }

        function initStarfield() {
            const starCount = 80000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(starCount * 3);
            const cols = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            const starColors = [
                new THREE.Color('#9bb0ff'), new THREE.Color('#ffffff'),
                new THREE.Color('#ffcc6f'), new THREE.Color('#ff7b7b')
            ];

            for (let i = 0; i < starCount; i++) {
                const r = 400 + Math.random() * 4000;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i * 3 + 1] = r * Math.cos(phi);
                pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

                const colorType = Math.random();
                let c;
                if (colorType > 0.9) c = starColors[0];
                else if (colorType > 0.6) c = starColors[1];
                else if (colorType > 0.3) c = starColors[2];
                else c = starColors[3];

                cols[i * 3] = c.r;
                cols[i * 3 + 1] = c.g;
                cols[i * 3 + 2] = c.b;
                sizes[i] = 1.0 + Math.random() * 4.0;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('customColor', new THREE.BufferAttribute(cols, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            starUniforms = { uTime: { value: 0 } };
            const mat = new THREE.ShaderMaterial({
                uniforms: starUniforms,
                vertexShader: document.getElementById('starVertexShader').textContent,
                fragmentShader: document.getElementById('starFragmentShader').textContent,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            stars = new THREE.Points(geo, mat);
            scene.add(stars);

            const nebulaCount = 120;
            const nebGeo = new THREE.BufferGeometry();
            const nebPos = new Float32Array(nebulaCount * 3);
            const nebCols = new Float32Array(nebulaCount * 3);
            const nebSizes = new Float32Array(nebulaCount);
            for (let i = 0; i < nebulaCount; i++) {
                const r = 800 + Math.random() * 2000;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.PI / 2 + (Math.random() - 0.5) * 1.5;
                nebPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                nebPos[i * 3 + 1] = r * Math.cos(phi);
                nebPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
                const nc = new THREE.Color().setHSL(0.6 + Math.random() * 0.2, 0.8, 0.04);
                nebCols[i * 3] = nc.r;
                nebCols[i * 3 + 1] = nc.g;
                nebCols[i * 3 + 2] = nc.b;
                nebSizes[i] = 400.0 + Math.random() * 800.0;
            }
            nebGeo.setAttribute('position', new THREE.BufferAttribute(nebPos, 3));
            nebGeo.setAttribute('customColor', new THREE.BufferAttribute(nebCols, 3));
            nebGeo.setAttribute('size', new THREE.BufferAttribute(nebSizes, 1));
            const nebShaderMat = new THREE.ShaderMaterial({
                uniforms: {},
                vertexShader: document.getElementById('starVertexShader').textContent,
                fragmentShader: `
                    varying vec3 vColor;
                    void main() {
                        vec2 cxy = 2.0 * gl_PointCoord - 1.0;
                        float r = dot(cxy, cxy);
                        if(r > 1.0) discard;
                        float glow = pow(1.0 - r, 2.0);
                        gl_FragColor = vec4(vColor, glow * 0.08);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            nebula = new THREE.Points(nebGeo, nebShaderMat);
            scene.add(nebula);
        }

        function initStarTrails() {
            const count = 2000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const cols = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                const radius = 400 + Math.random() * 2500;
                const angle = Math.random() * Math.PI * 2;
                const spread = (Math.random() - 0.5) * 15;
                
                pos[i*3] = radius * Math.cos(angle);
                pos[i*3+1] = spread * 3;
                pos[i*3+2] = radius * Math.sin(angle);

                const brightness = 0.2 + Math.random() * 0.3;
                cols[i*3] = brightness * 0.8;
                cols[i*3+1] = brightness * 0.9;
                cols[i*3+2] = brightness * 1.0;

                sizes[i] = 0.5 + Math.random() * 1.5;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('customColor', new THREE.BufferAttribute(cols, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.ShaderMaterial({
                uniforms: starUniforms,
                vertexShader: document.getElementById('starVertexShader').textContent,
                fragmentShader: `
                    varying vec3 vColor;
                    void main() {
                        vec2 cxy = 2.0 * gl_PointCoord - 1.0;
                        float r = dot(cxy, cxy);
                        if(r > 1.0) discard;
                        float glow = pow(1.0 - r, 2.5);
                        gl_FragColor = vec4(vColor, glow * 0.15);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            starTrails = new THREE.Points(geo, mat);
            scene.add(starTrails);
        }

        function initPlanets() {
            planetGroup = new THREE.Group();
            scene.add(planetGroup);

            const vShader = document.getElementById('planetVertexShader').textContent;
            const fShader = document.getElementById('planetFragmentShader').textContent;

            createPlanet(planetGroup, vShader, fShader,
                new THREE.Color('#4a6fa5'), new THREE.Color('#2c3e50'), 8.0,
                { x: -300, y: 120, z: -450 }, 10, 0.2
            );

            createPlanet(planetGroup, vShader, fShader,
                new THREE.Color('#c0392b'), new THREE.Color('#e67e22'), 5.0,
                { x: 380, y: -100, z: -600 }, 14, 0.5
            );

            createPlanet(planetGroup, vShader, fShader,
                new THREE.Color('#888888'), new THREE.Color('#cccccc'), 15.0,
                { x: -180, y: -220, z: -350 }, 6, 0.1
            );
        }

        function createPlanet(group, vShader, fShader, c1, c2, nScale, pos, radius, atmo) {
            const geo = new THREE.SphereGeometry(radius, 48, 48);
            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    color1: { value: c1 },
                    color2: { value: c2 },
                    noiseScale: { value: nScale },
                    lightDir: { value: new THREE.Vector3(1, 0.5, 1) },
                    atmosphere: { value: atmo }
                },
                vertexShader: vShader,
                fragmentShader: fShader
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(pos.x, pos.y, pos.z);
            group.add(mesh);
        }

        const clock = new THREE.Clock();
        let autoIdleTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            uniforms.uTime.value = elapsedTime;
            if (starUniforms) starUniforms.uTime.value = elapsedTime;

            if (stars) stars.rotation.y = elapsedTime * 0.005;
            if (nebula) nebula.rotation.y = elapsedTime * 0.003;
            if (starTrails) starTrails.rotation.y = elapsedTime * 0.008;

            if (planetGroup) {
                planetGroup.children.forEach((planet, idx) => {
                    planet.rotation.y = elapsedTime * (0.05 + idx * 0.02);
                });
                planetGroup.rotation.y = Math.sin(elapsedTime * 0.05) * 0.02;
            }

            if (isHandDetected) {
                // 手势控制时，targetRotY 由 onResults 更新
            } else {
                // 无手势时自动缓慢旋转
                targetRotY += 0.005;
            }

            // 平滑过渡
            currentRotY += (targetRotY - currentRotY) * 0.08;
            particles.rotation.y = currentRotY;

            if (!isHandDetected) {
                autoIdleTime += 0.005;
                targetScale = 1.0 + Math.sin(autoIdleTime) * 0.15;
                targetRotX = 0.4 + Math.sin(autoIdleTime * 0.3) * 0.15;

                if (statusElement) {
                    statusElement.innerHTML = "自动巡航 · 360° 展示<br>输入信号: 等待中...";
                    statusElement.style.color = "#666";
                }
            } else {
                if (statusElement) {
                    statusElement.innerHTML = "手动控制 · 手势旋转<br>输入信号: <span class='highlight'>已锁定</span>";
                    statusElement.style.color = "#6ba3ff";
                }
            }

            const lerpFactor = 0.08;
            currentScale += (targetScale - currentScale) * lerpFactor;
            currentRotX += (targetRotX - currentRotX) * lerpFactor;

            uniforms.uScale.value = currentScale;
            uniforms.uRotationX.value = currentRotX;

            renderer.render(scene, camera);
        }

        function initHandTracking() {
            if (typeof Hands === 'undefined') {
                setTimeout(() => {
                    initHandTracking();
                }, 2000);
                return;
            }

            try {
                const hands = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.7
                });

                hands.onResults(onResults);

                function onResults(results) {
                    if (loadingElement) loadingElement.style.display = 'none';

                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        isHandDetected = true;
                        const hand = results.multiHandLandmarks[0];

                        const p1 = hand[4];
                        const p2 = hand[8];
                        const dist = Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);
                        const normDist = Math.max(0, Math.min(1, (dist - 0.02) / 0.25));
                        targetScale = 0.15 + normDist * 2.35;

                        const y = hand[9].y;
                        const normY = Math.max(0, Math.min(1, (y - 0.1) / 0.8));
                        targetRotX = -0.6 + normY * 1.6;

                        targetRotY = hand[9].x * Math.PI * 2;
                    } else {
                        isHandDetected = false;
                    }
                }

                const cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 640,
                    height: 480
                });

                cameraUtils.start().then(() => {
                    console.log("🌍 摄像头已启动，手势控制就绪");
                }).catch(e => {
                    console.warn('摄像头启动失败，使用自动巡航模式:', e.message);
                    if (loadingElement) {
                        loadingElement.innerText = '摄像头未授权，自动巡航模式';
                        setTimeout(() => {
                            loadingElement.style.display = 'none';
                        }, 2000);
                    }
                });
            } catch (e) {
                console.warn('手势追踪初始化失败:', e.message);
                if (loadingElement) {
                    loadingElement.innerText = '手势模块加载失败，自动巡航模式';
                    setTimeout(() => {
                        loadingElement.style.display = 'none';
                    }, 2000);
                }
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        initThree();
        setTimeout(() => {
            initHandTracking();
        }, 1000);
    </script>
</body>
</html>
